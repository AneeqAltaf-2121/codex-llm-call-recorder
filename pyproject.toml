[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codex-probe"
version = "0.1.0"
description = "Transparent LLM call recorder and backend swap harness for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aneeq Altaf", email = "aneeqchagani@gmail.com" }]
keywords = ["codex", "llm", "proxy", "recorder", "streaming", "sse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
codex-probe = "codex_probe.cli:main"

[project.urls]
Homepage = "https://github.com/AneeqAltaf-2121/codex-llm-call-recorder"
Repository = "https://github.com/AneeqAltaf-2121/codex-llm-call-recorder"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
